<script>


/*******************************************************
 * CONFIGURATION
 *******************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyqJNwQPv3fi45h6qHdzgPkrwI4rTmCAjGRm-M6n9oQkb-3p43Uwk02BRdF9P-9I1dC2A/exec";


let bloque =
  false;


let compteurJSONP =
  0;



/*******************************************************
 * SNAPSHOT LOCAL
 *******************************************************/

const DB_NOM = "prioriteSelfScannerOffline";
const DB_VERSION = 2;
const SYNC_INTERVALLE = 10 * 60 * 1000;
let syncEnCours = false;
let snapshotLocal = null;
let envoiPassagesEnCours = false;
let passagesEnAttente = 0;

function ouvrirBaseLocale_() {
  return new Promise(function(resolve, reject) {
    if (!window.indexedDB) {
      reject(new Error("IndexedDB indisponible"));
      return;
    }
    const demande = indexedDB.open(DB_NOM, DB_VERSION);
    demande.onupgradeneeded = function() {
      const db = demande.result;
      if (!db.objectStoreNames.contains("snapshots")) {
        db.createObjectStore("snapshots");
      }
      if (!db.objectStoreNames.contains("passages")) {
        db.createObjectStore("passages", {keyPath: "cle"});
      }
    };
    demande.onsuccess = function() { resolve(demande.result); };
    demande.onerror = function() { reject(demande.error); };
  });
}

async function lireSnapshotLocal_() {
  const db = await ouvrirBaseLocale_();
  try {
    return await new Promise(function(resolve, reject) {
      const transaction = db.transaction("snapshots", "readonly");
      const demande = transaction.objectStore("snapshots").get("courant");
      demande.onsuccess = function() { resolve(demande.result || null); };
      demande.onerror = function() { reject(demande.error); };
    });
  } finally {
    db.close();
  }
}

async function enregistrerSnapshotLocal_(snapshot) {
  const db = await ouvrirBaseLocale_();
  try {
    await new Promise(function(resolve, reject) {
      const transaction = db.transaction("snapshots", "readwrite");
      transaction.objectStore("snapshots").put(snapshot, "courant");
      transaction.oncomplete = resolve;
      transaction.onerror = function() { reject(transaction.error); };
      transaction.onabort = function() { reject(transaction.error); };
    });
  } finally {
    db.close();
  }
}

function afficherEtatSync_(message) {
  document.getElementById("etatSync").textContent = message;
}

function dateSyncLisible_(snapshot) {
  if (!snapshot || !snapshot.enregistreLe) return "jamais";
  return new Date(snapshot.enregistreLe).toLocaleString("fr-FR", {
    timeZone: "Europe/Paris", day: "2-digit", month: "2-digit",
    hour: "2-digit", minute: "2-digit"
  });
}

function rafraichirEtatSync_(detail) {
  const reseau = navigator.onLine ? "🟢 En ligne" : "🟠 Hors connexion";
  const base = snapshotLocal
    ? "Base locale : " + Object.keys(snapshotLocal.eleves).length +
      " élèves · dernière synchro : " + dateSyncLisible_(snapshotLocal)
    : "Base locale indisponible";
  const attente = passagesEnAttente
    ? " · " + passagesEnAttente + " passage(s) à transmettre" : "";
  afficherEtatSync_(reseau + " · " + base + attente + (detail ? " · " + detail : ""));
}

async function lirePassages_() {
  const db = await ouvrirBaseLocale_();
  try {
    return await new Promise(function(resolve, reject) {
      const t = db.transaction("passages", "readonly");
      const r = t.objectStore("passages").getAll();
      r.onsuccess = function() { resolve(r.result || []); };
      r.onerror = function() { reject(r.error); };
    });
  } finally { db.close(); }
}
async function modifierPassage_(passage, suppression) {
  const db = await ouvrirBaseLocale_();
  try {
    await new Promise(function(resolve, reject) {
      const t = db.transaction("passages", "readwrite");
      const store = t.objectStore("passages");
      if (suppression) store.delete(passage.cle);
      else store.put(passage);
      t.oncomplete = resolve;
      t.onerror = function() { reject(t.error); };
      t.onabort = function() { reject(t.error); };
    });
  } finally { db.close(); }
}
function nouvelleClePassage_() {
  return crypto.randomUUID
    ? crypto.randomUUID()
    : Array.from(crypto.getRandomValues(new Uint8Array(16)),
        b => b.toString(16).padStart(2, '0')).join('');
}
async function memoriserPassage_(id, resultat, cle) {
  if (!resultat.prenom && !resultat.nom && !resultat.classe) return;
  cle = cle || nouvelleClePassage_();
  await modifierPassage_({
    cle, id, controleLe: new Date().toISOString(),
    resultat: {
      titre: resultat.titre, autorise: resultat.autorise,
      prenom: resultat.prenom, nom: resultat.nom, classe: resultat.classe,
      club: resultat.club || '', exceptionnelle: !!resultat.exceptionnelle,
      enRetard: !!resultat.enRetard, superPrio: !!resultat.superPrio
    }
  }, false);
  passagesEnAttente++;
  rafraichirEtatSync_();
  if (navigator.onLine) envoyerPassages_();
}
function envoyerPassageJSONP_(passage) {
  return new Promise(function(resolve, reject) {
    const nom = "prioriteSelfPassage_" + Date.now() + "_" +
      Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let fini = false;
    const timer = setTimeout(function() { terminer(new Error("Délai dépassé")); }, 20000);
    function terminer(erreur, reponse) {
      if (fini) return;
      fini = true;
      clearTimeout(timer);
      script.remove();
      if (erreur) {
        window[nom] = function() { delete window[nom]; };
        reject(erreur);
      } else {
        delete window[nom];
        resolve(reponse);
      }
    }
    window[nom] = function(reponse) { terminer(null, reponse); };
    script.onerror = function() { terminer(new Error("Connexion indisponible")); };
    script.src = API_URL + "?api=1&passageDiffere=1" +
      "&donnees=" + encodeURIComponent(JSON.stringify(passage)) +
      "&callback=" + encodeURIComponent(nom);
    document.body.appendChild(script);
  });
}
async function envoyerPassages_() {
  if (envoiPassagesEnCours || !navigator.onLine) return;
  envoiPassagesEnCours = true;
  try {
    const passages = await lirePassages_();
    passagesEnAttente = passages.length;
    rafraichirEtatSync_();
    for (const passage of passages) {
      const reponse = await envoyerPassageJSONP_(passage);
      if (!reponse || reponse.ok !== true || reponse.cle !== passage.cle)
        throw new Error("Passage non confirmé par le serveur");
      await modifierPassage_(passage, true);
      passagesEnAttente--;
      rafraichirEtatSync_();
    }
  } catch (erreur) {
    console.warn("Passages différés PRIOSELF :", erreur);
    rafraichirEtatSync_("historique en attente");
  } finally { envoiPassagesEnCours = false; }
}

function demanderSnapshot_() {
  return new Promise(function(resolve, reject) {
    const nom = "prioriteSelfSync_" + Date.now() + "_" +
      Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let termine = false;
    const minuterie = setTimeout(function() {
      terminer(new Error("Délai de synchronisation dépassé"));
    }, 20000);

    function terminer(erreur, donnees) {
      if (termine) return;
      termine = true;
      clearTimeout(minuterie);
      script.remove();
      // Garder un rappel inoffensif si une réponse JSONP arrive en retard.
      if (erreur) {
        window[nom] = function() { delete window[nom]; };
        reject(erreur);
      } else {
        delete window[nom];
        resolve(donnees);
      }
    }

    window[nom] = function(donnees) { terminer(null, donnees); };
    script.onerror = function() { terminer(new Error("Réseau indisponible")); };
    script.src = API_URL + "?api=1&sync=1&callback=" +
      encodeURIComponent(nom) + "&t=" + Date.now();
    document.body.appendChild(script);
  });
}

async function synchroniserSnapshot_() {
  if (syncEnCours || !navigator.onLine) {
    rafraichirEtatSync_();
    return;
  }
  syncEnCours = true;
  rafraichirEtatSync_("synchronisation...");
  try {
    const reponse = await demanderSnapshot_();
    if (!reponse || reponse.ok !== true ||
        !reponse.eleves || typeof reponse.eleves !== "object" ||
        !reponse.priorites || typeof reponse.priorites !== "object" ||
        !reponse.exceptions || typeof reponse.exceptions !== "object" ||
        !reponse.synchroniseLe || !reponse.semaineActuelle) {
      throw new Error("Snapshot incomplet");
    }
    const snapshot = {
      version: reponse.version,
      synchroniseLe: reponse.synchroniseLe,
      semaineActuelle: reponse.semaineActuelle,
      eleves: reponse.eleves,
      priorites: reponse.priorites,
      exceptions: reponse.exceptions,
      enregistreLe: new Date().toISOString()
    };
    await enregistrerSnapshotLocal_(snapshot);
    snapshotLocal = snapshot;
    rafraichirEtatSync_();
  } catch (erreur) {
    console.warn("Synchronisation PRIOSELF :", erreur);
    rafraichirEtatSync_("synchro échouée");
  } finally {
    syncEnCours = false;
  }
}

async function initialiserBaseLocale_() {
  try {
    snapshotLocal = await lireSnapshotLocal_();
    passagesEnAttente = (await lirePassages_()).length;
    rafraichirEtatSync_();
  } catch (erreur) {
    console.warn("Base locale PRIOSELF :", erreur);
    rafraichirEtatSync_("stockage local indisponible");
  }
  synchroniserSnapshot_();
  envoyerPassages_();
  setInterval(synchroniserSnapshot_, SYNC_INTERVALLE);
  setInterval(envoyerPassages_, SYNC_INTERVALLE);
  window.addEventListener("online", function() {
    synchroniserSnapshot_();
    envoyerPassages_();
  });
  window.addEventListener("offline", function() { rafraichirEtatSync_(); });
}

initialiserBaseLocale_();

/*******************************************************
 * QR DÉTECTÉ
 *******************************************************/

function qrDetecte(
  texte
) {


  if (bloque) {

    return;

  }


  bloque =
    true;


  document
    .getElementById(
      "etat"
    )
    .textContent =
      "QR détecté ✓";


  let id =
    "";


  /*****************************************************
   * EXTRACTION DE L'IDENTIFIANT
   *****************************************************/

  try {


    const url =
      new URL(
        texte
      );


    id =
      url.searchParams.get(
        "id"
      ) || "";


  } catch (e) {


    /*
     * Le QR peut également contenir
     * uniquement l'identifiant.
     */

    id =
      String(
        texte || ""
      ).trim();

  }


  id =
    String(
      id || ""
    ).trim();


  if (!id) {


    afficherErreur(
      "QR code non reconnu."
    );


    bloque =
      false;


    return;

  }


  verifierEleve(
    id
  );

}



/*******************************************************
 * APPEL JSONP
 *
 * Cette méthode évite les problèmes CORS
 * entre GitHub Pages et Apps Script.
 *******************************************************/

function resultatLocal_(id) {
  const s = snapshotLocal;
  if (!s || !s.eleves || !s.priorites || !s.exceptions) return null;
  const parts = Object.fromEntries(new Intl.DateTimeFormat('fr-FR', {
    timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit',
    day: '2-digit', weekday: 'long', hour: '2-digit', minute: '2-digit',
    hourCycle: 'h23'
  }).formatToParts(new Date()).filter(p => p.type !== 'literal')
    .map(p => [p.type, p.value]));
  const jour = parts.weekday[0].toUpperCase() + parts.weekday.slice(1);
  const jours = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const date = Date.UTC(+parts.year, +parts.month - 1, +parts.day);
  const lundi = date - ((jours.indexOf(jour) + 6) % 7) * 86400000;
  const synchro = new Date(s.enregistreLe);
  if (isNaN(synchro.getTime())) return null;
  const sp = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Paris', year:'numeric', month:'2-digit', day:'2-digit'
  }).formatToParts(synchro).filter(p => p.type !== 'literal')
    .map(p => [p.type, p.value]));
  const sd = Date.UTC(+sp.year, +sp.month - 1, +sp.day);
  const sl = sd - ((new Date(sd).getUTCDay() + 6) % 7) * 86400000;
  if (lundi !== sl || !['A','B'].includes(s.semaineActuelle)) return null;
  const semaine = s.semaineActuelle;
  const heure = parts.hour + ':' + parts.minute;
  const hm = minutesLocal_(heure);
  const e = s.eleves[id];
  const commun = {jourControle:jour, heureControle:heure, semaineControle:semaine};
  const personne = e ? {prenom:e.prenom, nom:e.nom, classe:e.classe, groupes:e.groupes} : {};
  const res = (autorise, titre, message, details) =>
    Object.assign({}, commun, personne, {autorise, titre, message}, details || {});
  if (!e) return res(false, 'CARTE INCONNUE', 'Cet identifiant n’existe pas dans la base.');
  if (!e.actif) return res(false, 'NON PRIORITAIRE', 'Carte actuellement désactivée.');
  let exRetard = null;
  for (const x of s.exceptions[id] || []) {
    const d = dateLocale_(x.dateDebut), f = dateLocale_(x.dateFin);
    const joursEx = x.jours || 'Tous les jours', semaineEx = x.semaine || 'Toutes';
    if (!x.actif || !(date >= d && date <= f) ||
        !(joursEx === 'Tous les jours' || joursEx.split('|').some(j => j.trim() === jour)) ||
        !(semaineEx === 'Toutes' || semaineEx === 'A+B' || semaineEx === semaine)) continue;
    const debut = minutesLocal_(x.debut), fin = minutesLocal_(x.fin);
    const details = {exceptionnelle:true, club:x.activite, debut:x.debut, fin:x.fin,
      dateDebutPriorite:x.dateDebut, dateFinPriorite:x.dateFin, semainePriorite:'EXCEPTION'};
    if (debut >= 0 && fin >= 0 && hm >= debut && hm <= fin)
      return res(true, 'PRIORITÉ EXCEPTIONNELLE', x.activite,
        Object.assign({superPrio:fin - debut <= 30}, details));
    const retard = hm - fin;
    if (fin >= 0 && retard >= 1 && retard <= 30 &&
        (!exRetard || retard < exRetard.retard)) exRetard = {x, retard, details};
  }
  if (exRetard) return res(true,
    'PRIORITÉ EXCEPTIONNELLE • EN RETARD DE ' + exRetard.retard + ' MIN',
    exRetard.x.activite, Object.assign({enRetard:true,
      retardMinutes:exRetard.retard}, exRetard.details));
  const priorites = s.priorites[id] || [];
  let desactivee = null;
  for (const p of priorites) {
    if (!(p.semaine === 'A+B' || p.semaine === semaine) || p.jour !== jour) continue;
    const debut = minutesLocal_(p.debut), fin = minutesLocal_(p.fin);
    if (debut < 0 || fin < 0 || hm < debut || hm > fin) continue;
    if (!p.actif) { if (!desactivee) desactivee = p; continue; }
    const superPrio = fin - debut <= 30;
    return res(true, superPrio ? 'SUPER PRIO' : 'ACCÈS PRIORITAIRE', p.club,
      {superPrio, club:p.club, debut:p.debut, fin:p.fin, semainePriorite:p.semaine});
  }
  let retard = null;
  for (const p of priorites) {
    if (!p.actif || !(p.semaine === 'A+B' || p.semaine === semaine) || p.jour !== jour) continue;
    const fin = minutesLocal_(p.fin), n = hm - fin;
    if (fin >= 0 && n >= 1 && n <= 30 && (!retard || n < retard.n)) retard = {p,n};
  }
  if (retard) return res(true, 'PRIORITAIRE • EN RETARD DE ' + retard.n + ' MIN',
    retard.p.club, {enRetard:true, retardMinutes:retard.n, club:retard.p.club,
      debut:retard.p.debut, fin:retard.p.fin, semainePriorite:retard.p.semaine});
  if (desactivee) return res(false, 'PRIORITÉ DÉSACTIVÉE', desactivee.club,
    {club:desactivee.club, debut:desactivee.debut, fin:desactivee.fin,
      semainePriorite:desactivee.semaine});
  return res(false, 'NON PRIORITAIRE', 'Aucune priorité à cet horaire.');
}

function minutesLocal_(texte) {
  const m = String(texte || '').match(/^(\d{1,2}):(\d{2})$/);
  return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : -1;
}
function dateLocale_(texte) {
  const m = String(texte || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : NaN;
}

    ] =

/*******************************************************
 * SCANNER MOBILE FIABLE
 *
 * Objectifs :
 * - caméra arrière par défaut ;
 * - liste réelle des objectifs après autorisation ;
 * - mémorisation de l'objectif choisi ;
 * - résolution élevée sans imposer un ratio carré ;
 * - autofocus continu si le navigateur le permet ;
 * - reprise après verrouillage / retour dans l'application.
 *******************************************************/

let lecteurQR = null;
let camerasDisponibles = [];
let cameraCourante = "";
let scannerActif = false;
let demarrageEnCours = false;
let repriseTimer = null;
let timerRecherche = null;
let compteurRecherche = 0;

const CLE_CAMERA = "prioriteSelfCameraIdV2";

function creerLecteur_() {
  if (!lecteurQR) {
    lecteurQR = new Html5Qrcode("reader");
  }
  return lecteurQR;
}

async function obtenirPermissionEtCameras_() {
  /*
   * Sur beaucoup de téléphones, enumerateDevices() masque les différents
   * objectifs tant qu'une première autorisation caméra n'a pas été accordée.
   */
  try {
    const permission = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    permission.getTracks().forEach(function(track) {
      track.stop();
    });
  } catch (e) {
    // Html5Qrcode affichera ensuite l'erreur utile si l'accès est refusé.
  }

  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    camerasDisponibles = devices
      .filter(function(device) {
        return device.kind === "videoinput";
      })
      .map(function(device, index) {
        return {
          id: device.deviceId,
          label: device.label || ("Caméra " + (index + 1))
        };
      });
  } catch (e) {
    camerasDisponibles = [];
  }

  return camerasDisponibles;
}

function scoreCameraQR_(camera) {
  const label = String(camera.label || "").toLowerCase();
  let score = 0;

  // Écarte fortement la caméra avant.
  if (/front|user|selfie|facetime|avant/i.test(label)) score -= 1000;

  // Favorise une caméra arrière.
  if (/back|rear|environment|arrière|arriere|dos/i.test(label)) score += 200;

  // La caméra principale / grand-angle 1x est généralement idéale pour un QR.
  if (/main|principal|primary|wide(?!.*ultra)|1x|camera 0\b|caméra 0\b/i.test(label)) {
    score += 120;
  }

  // Macro : intéressante de près, mais pas le meilleur choix universel.
  if (/macro/i.test(label)) score += 25;

  // Ultra grand-angle et téléobjectifs sont moins adaptés par défaut.
  if (/ultra|ultrawide|ultra wide|0[.,]5x|0[.,]6x/i.test(label)) score -= 80;
  if (/tele|télé|telephoto|2x|3x|5x|10x/i.test(label)) score -= 60;

  return score;
}

function choisirCameraArriere_() {
  /*
   * RÈGLE N°1 : si l'utilisateur a déjà choisi une caméra manuellement,
   * on ne remet jamais en cause son choix.
   */
  const memorisee = localStorage.getItem(CLE_CAMERA) || "";

  if (
    memorisee &&
    camerasDisponibles.some(function(c) {
      return c.id === memorisee;
    })
  ) {
    return memorisee;
  }

  /*
   * Premier lancement seulement : classement prudent à partir du nom
   * réellement exposé par le téléphone. Aucun changement du moteur caméra.
   */
  if (!camerasDisponibles.length) return "";

  const classees = camerasDisponibles
    .map(function(camera, index) {
      return {
        camera: camera,
        index: index,
        score: scoreCameraQR_(camera)
      };
    })
    .sort(function(a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.index - b.index;
    });

  return classees[0].camera.id;
}

async function appliquerReglagesCamera_() {
  const video = document.querySelector("#reader video");

  if (!video || !video.srcObject) return;

  video.setAttribute("playsinline", "true");
  video.setAttribute("autoplay", "true");

  const tracks = video.srcObject.getVideoTracks();

  if (!tracks.length) return;

  const track = tracks[0];

  try {
    const settings = track.getSettings ? track.getSettings() : {};

    if (settings.deviceId) {
      cameraCourante = settings.deviceId;
      localStorage.setItem(CLE_CAMERA, cameraCourante);
    }
  } catch (e) {}

  /*
   * Ne jamais imposer focusMode à un téléphone qui ne l'annonce pas.
   * Quand "continuous" existe, on l'active explicitement.
   */
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const advanced = [];

    if (
      Array.isArray(caps.focusMode) &&
      caps.focusMode.indexOf("continuous") !== -1
    ) {
      advanced.push({ focusMode: "continuous" });
    }

    if (caps.width && caps.width.max) {
      advanced.push({ width: caps.width.max });
    }

    if (caps.height && caps.height.max) {
      advanced.push({ height: caps.height.max });
    }

    if (advanced.length) {
      for (const contrainte of advanced) {
        try {
          await track.applyConstraints({ advanced: [contrainte] });
        } catch (e) {}
      }
    }
  } catch (e) {}
}

async function demarrerScanner_(cameraId) {
  if (demarrageEnCours || scannerActif) return;

  demarrageEnCours = true;

  try {
    const lecteur = creerLecteur_();

    if (!camerasDisponibles.length) {
      await obtenirPermissionEtCameras_();
    }

    const id =
      cameraId ||
      choisirCameraArriere_();

    /*
     * Si le navigateur fournit des deviceId, on choisit précisément
     * l'objectif. Sinon on demande simplement la caméra arrière.
     */
    /*
     * IMPORTANT : quand un objectif précis est choisi, son deviceId doit
     * être porté par UNE SEULE contrainte vidéo. La version précédente
     * mélangeait le choix de caméra et videoConstraints ; sur certains
     * mobiles html5-qrcode retombait alors systématiquement sur la caméra 1.
     */
    const cameraConfig = id
      ? id
      : { facingMode: "environment" };

    const contraintesVideo = id
      ? {
          deviceId: { exact: id },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      : {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        };

    await lecteur.start(
      cameraConfig,
      {
        fps: 12,

        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const taille = Math.max(
            220,
            Math.floor(minEdge * 0.82)
          );

          return {
            width: Math.min(taille, viewfinderWidth),
            height: Math.min(taille, viewfinderHeight)
          };
        },

        videoConstraints: contraintesVideo
      },
      qrDetecte,
      function() {}
    );

    scannerActif = true;

    await appliquerReglagesCamera_();

    /*
     * Rafraîchit la liste après démarrage puis sélectionne explicitement
     * l'objectif réellement actif.
     */
    await obtenirListeCamerasSansCouper_();

    const videoActif = document.querySelector("#reader video");
    if (videoActif && videoActif.srcObject) {
      const tracksActifs = videoActif.srcObject.getVideoTracks();
      if (tracksActifs.length && tracksActifs[0].getSettings) {
        const actif = tracksActifs[0].getSettings().deviceId || "";
        if (actif) {
          cameraCourante = actif;
          localStorage.setItem(CLE_CAMERA, actif);
        }
      }
    }

    remplirListeCameras_();

    document.getElementById("etat").textContent =
      "Scanner prêt • " + camerasDisponibles.length + " caméra(s)";

  } catch (e) {
    scannerActif = false;

    /*
     * Au chargement mobile, une première tentative peut être interrompue
     * pendant que le navigateur finalise l'autorisation / l'énumération
     * des caméras. On ne montre donc pas une fausse alerte immédiatement.
     */
    document.getElementById("etat").textContent =
      "Initialisation de la caméra...";

    setTimeout(async function() {
      if (scannerActif || demarrageEnCours || document.hidden) return;

      try {
        await obtenirListeCamerasSansCouper_();
        await demarrerScanner_(
          localStorage.getItem(CLE_CAMERA) ||
          choisirCameraArriere_()
        );

        /*
         * L'erreur visible n'est affichée que si la seconde tentative
         * échoue réellement.
         */
        if (!scannerActif) {
          document.getElementById("etat").textContent =
            "Caméra non disponible";

          afficherErreur(
            "Impossible de démarrer la caméra. Vérifiez l’autorisation caméra puis rechargez la page."
          );
        }
      } catch (e2) {
        document.getElementById("etat").textContent =
          "Caméra non disponible";

        afficherErreur(
          "Impossible de démarrer la caméra. Vérifiez l’autorisation caméra puis rechargez la page."
        );
      }
    }, 700);
  } finally {
    demarrageEnCours = false;
  }
}

async function obtenirListeCamerasSansCouper_() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();

    camerasDisponibles = devices
      .filter(function(device) {
        return device.kind === "videoinput";
      })
      .map(function(device, index) {
        return {
          id: device.deviceId,
          label: device.label || ("Caméra " + (index + 1))
        };
      });
  } catch (e) {}

  remplirListeCameras_();
}

async function arreterScanner_() {
  if (!lecteurQR || !scannerActif) return;

  try {
    await lecteurQR.stop();
  } catch (e) {}

  scannerActif = false;
}

function remplirListeCameras_() {
  const select = document.getElementById("choixCamera");
  if (!select) return;

  const selection = cameraCourante || localStorage.getItem(CLE_CAMERA) || "";

  select.innerHTML = "";

  camerasDisponibles.forEach(function(camera, index) {
    const option = document.createElement("option");
    option.value = camera.id;
    option.textContent = "📷 " + (camera.label || ("Caméra " + (index + 1)));

    if (camera.id === selection) {
      option.selected = true;
    }

    select.appendChild(option);
  });

  if (!camerasDisponibles.length) {
    const option = document.createElement("option");
    option.value = "";
    option.textContent = "Aucune caméra";
    select.appendChild(option);
  }
}

async function choisirCameraDepuisListe_(event) {
  const id = event.target.value;

  if (!id || id === cameraCourante || demarrageEnCours) return;

  localStorage.setItem(CLE_CAMERA, id);

  await arreterScanner_();

  cameraCourante = id;

  await demarrerScanner_(id);
}

function programmerRepriseScanner_() {
  clearTimeout(repriseTimer);

  repriseTimer = setTimeout(async function() {
    if (document.hidden || bloque || demarrageEnCours) return;

    /*
     * Après un verrouillage, le flux vidéo peut être présent en mémoire
     * mais réellement suspendu. On le recrée proprement.
     */
    await arreterScanner_();

    if (!document.hidden && !bloque) {
      await obtenirListeCamerasSansCouper_();
      await demarrerScanner_(
        localStorage.getItem(CLE_CAMERA) || ""
      );
    }
  }, 450);
}

document
  .getElementById("choixCamera")
  .addEventListener("change", choisirCameraDepuisListe_);

document.addEventListener("visibilitychange", function() {
  if (!document.hidden) {
    programmerRepriseScanner_();
  }
});

window.addEventListener("pageshow", function() {
  programmerRepriseScanner_();
});

window.addEventListener("focus", function() {
  if (!document.hidden && !scannerActif) {
    programmerRepriseScanner_();
  }
});


/*******************************************************
 * RECHERCHE D'UN ÉLÈVE SANS CARTE
 *******************************************************/

function rechercherEleves_(texte) {
  const q = String(texte || "").trim();
  const zone = document.getElementById("resultatsRecherche");

  if (q.length < 2) {
    zone.style.display = "none";
    zone.innerHTML = "";
    return;
  }

  if (snapshotLocal && snapshotLocal.eleves) {
    const mots = q.toLocaleLowerCase("fr").normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "").split(/\s+/).filter(Boolean);
    const resultats = Object.keys(snapshotLocal.eleves).map(function(id) {
      return Object.assign({ id: id }, snapshotLocal.eleves[id]);
    }).filter(function(e) {
      if (!e.actif) return false;
      const contenu = [e.prenom, e.nom, e.classe].join(" ")
        .toLocaleLowerCase("fr").normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      return mots.every(function(mot) { return contenu.includes(mot); });
    }).sort(function(a, b) {
      return (a.nom + " " + a.prenom).localeCompare(
        b.nom + " " + b.prenom, "fr"
      );
    }).slice(0, 20);
    afficherResultatsRecherche_(resultats);
    return;
  }

  compteurRecherche++;
  const callbackName = "prioriteSelfRecherche_" + compteurRecherche;
  const script = document.createElement("script");

  window[callbackName] = function(resultats) {
    nettoyerJSONP(script, callbackName);
    afficherResultatsRecherche_(Array.isArray(resultats) ? resultats : []);
  };

  script.onerror = function() {
    nettoyerJSONP(script, callbackName);
    zone.style.display = "none";
  };

  script.src =
    API_URL +
    "?api=1" +
    "&recherche=" + encodeURIComponent(q) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  document.body.appendChild(script);
}

function afficherResultatsRecherche_(resultats) {
  const zone = document.getElementById("resultatsRecherche");

  if (!resultats.length) {
    zone.innerHTML =
      '<div class="resultat-eleve">Aucun élève trouvé</div>';
    zone.style.display = "block";
    return;
  }

  zone.innerHTML = resultats.map(function(e, i) {
    return (
      '<div class="resultat-eleve" data-index="' + i + '">' +
      '<strong>' + echapperRecherche_(e.prenom + " " + e.nom) + '</strong>' +
      ' • ' + echapperRecherche_(e.classe || "") +
      '</div>'
    );
  }).join("");

  zone.querySelectorAll(".resultat-eleve[data-index]").forEach(function(el) {
    el.addEventListener("click", function() {
      const e = resultats[Number(el.dataset.index)];
      if (!e) return;

      zone.style.display = "none";
      document.getElementById("rechercheEleve").value = "";
      bloque = true;
      verifierEleve(e.id);
    });
  });

  zone.style.display = "block";
}

function echapperRecherche_(texte) {
  return String(texte || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.getElementById("rechercheEleve")
  .addEventListener("input", function() {
    const valeur = this.value;

    clearTimeout(timerRecherche);
    timerRecherche = setTimeout(function() {
      rechercherEleves_(valeur);
    }, 250);
  });

document.addEventListener("click", function(e) {
  const zone = document.getElementById("resultatsRecherche");
  const champ = document.getElementById("rechercheEleve");

  if (e.target !== champ && !zone.contains(e.target)) {
    zone.style.display = "none";
  }
});
