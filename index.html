<script>


/*******************************************************
 * CONFIGURATION
 *******************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyqJNwQPv3fi45h6qHdzgPkrwI4rTmCAjGRm-M6n9oQkb-3p43Uwk02BRdF9P-9I1dC2A/exec";


let bloque =
  false;


let compteurJSONP =
  0;



/*******************************************************
 * QR DÉTECTÉ
 *******************************************************/

function qrDetecte(
  texte
) {


  if (bloque) {

    return;

  }


  bloque =
    true;


  document
    .getElementById(
      "etat"
    )
    .textContent =
      "QR détecté ✓";


  let id =
    "";


  /*****************************************************
   * EXTRACTION DE L'IDENTIFIANT
   *****************************************************/

  try {


    const url =
      new URL(
        texte
      );


    id =
      url.searchParams.get(
        "id"
      ) || "";


  } catch (e) {


    /*
     * Le QR peut également contenir
     * uniquement l'identifiant.
     */

    id =
      String(
        texte || ""
      ).trim();

  }


  id =
    String(
      id || ""
    ).trim();


  if (!id) {


    afficherErreur(
      "QR code non reconnu."
    );


    bloque =
      false;


    return;

  }


  verifierEleve(
    id
  );

}



/*******************************************************
 * APPEL JSONP
 *
 * Cette méthode évite les problèmes CORS
 * entre GitHub Pages et Apps Script.
 *******************************************************/

function verifierEleve(
  id
) {


  afficherChargement(
    true
  );


  compteurJSONP++;


  const callbackName =
    "prioriteSelfCallback_" +
    compteurJSONP;


  let script =
    document.createElement(
      "script"
    );


  let timeout =
    null;


  /*
   * Fonction appelée automatiquement
   * par Apps Script.
   */

  window[callbackName] =
    function(resultat) {


      clearTimeout(
        timeout
      );


      afficherChargement(
        false
      );


      nettoyerJSONP(
        script,
        callbackName
      );


      afficherResultat(
        resultat
      );

    };



  /*****************************************************
   * EN CAS D'ERREUR RÉSEAU
   *****************************************************/

  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      afficherChargement(
        false
      );


      nettoyerJSONP(
        script,
        callbackName
      );


      afficherErreur(
        "Impossible de contacter le serveur."
      );


      bloque =
        false;

    };



  /*****************************************************
   * CONSTRUCTION DE L'URL
   *****************************************************/

  script.src =

    API_URL

    +

    "?api=1"

    +

    "&id="

    +

    encodeURIComponent(
      id
    )

    +

    "&callback="

    +

    encodeURIComponent(
      callbackName
    )

    +

    "&t="

    +

    Date.now();



  /*****************************************************
   * TIMEOUT DE SÉCURITÉ
   *****************************************************/

  timeout =
    setTimeout(
      function() {


        afficherChargement(
          false
        );


        nettoyerJSONP(
          script,
          callbackName
        );


        afficherErreur(
          "Le serveur met trop de temps à répondre."
        );


        bloque =
          false;


      },
      12000
    );



  /*****************************************************
   * ENVOI
   *****************************************************/

  document.body.appendChild(
    script
  );

}



/*******************************************************
 * NETTOYAGE JSONP
 *******************************************************/

function nettoyerJSONP(
  script,
  callbackName
) {


  try {


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }


  } catch (e) {

  }


  try {


    delete window[
      callbackName
    ];


  } catch (e) {


    window[
      callbackName
    ] =
      undefined;

  }

}



/*******************************************************
 * AFFICHAGE DU RÉSULTAT
 *******************************************************/

function afficherResultat(
  r
) {


  const zone =
    document.getElementById(
      "resultat"
    );


  const symbole =
    document.getElementById(
      "symbole"
    );



  /*****************************************************
   * VERT
   *****************************************************/

  if (
    r.autorise
  ) {


    zone.className =
      "vert";


    symbole.textContent =
      "✓";


  }


  /*****************************************************
   * ROUGE
   *****************************************************/

  else {


    zone.className =
      "rouge";


    symbole.textContent =
      "✕";

  }



  /*****************************************************
   * TITRE
   *****************************************************/

  document
    .getElementById(
      "statut"
    )
    .textContent =

      r.titre || "";



  /*****************************************************
   * NOM
   *****************************************************/

  const nomComplet =

    (
      (r.prenom || "")
      +
      " "
      +
      (r.nom || "")
    )
    .trim();


  document
    .getElementById(
      "nom"
    )
    .textContent =
      nomComplet;



  /*****************************************************
   * CLASSE
   *****************************************************/

  document
    .getElementById(
      "classe"
    )
    .textContent =

      r.classe || "";



  /*****************************************************
   * CLUB OU MOTIF DU REFUS
   *****************************************************/

  document
    .getElementById(
      "club"
    )
    .textContent =

      r.autorise

      ?

      (
        r.club || ""
      )

      :

      (
        r.message || ""
      );



  /*****************************************************
   * HORAIRE DU CLUB
   *****************************************************/

  document
    .getElementById(
      "horaire"
    )
    .textContent =

      r.autorise

      ?

      (
        (r.debut || "")
        +
        " → "
        +
        (r.fin || "")
      )

      :

      "";



  /*****************************************************
   * HEURE DU CONTRÔLE
   *****************************************************/

  document
    .getElementById(
      "controle"
    )
    .textContent =

      "Contrôle : "

      +

      (r.jourControle || "")

      +

      " à "

      +

      (r.heureControle || "");

}



/*******************************************************
 * SCANNER LE SUIVANT
 *******************************************************/

function scannerSuivant() {


  document
    .getElementById(
      "resultat"
    )
    .className =
      "";


  document
    .getElementById(
      "etat"
    )
    .textContent =
      "Scanner prêt";


  bloque =
    false;

}



/*******************************************************
 * CHARGEMENT
 *******************************************************/

function afficherChargement(
  visible
) {


  const chargement =
    document.getElementById(
      "chargement"
    );


  chargement.className =

    visible

    ?

    "visible"

    :

    "";

}



/*******************************************************
 * ERREUR
 *******************************************************/

function afficherErreur(
  message
) {


  const erreur =
    document.getElementById(
      "erreur"
    );


  erreur.style.display =
    "block";


  erreur.textContent =
    message;


  setTimeout(
    function() {


      erreur.style.display =
        "none";


    },
    5000
  );

}



/*******************************************************
 * SCANNER MOBILE FIABLE
 *
 * Objectifs :
 * - caméra arrière par défaut ;
 * - liste réelle des objectifs après autorisation ;
 * - mémorisation de l'objectif choisi ;
 * - résolution élevée sans imposer un ratio carré ;
 * - autofocus continu si le navigateur le permet ;
 * - reprise après verrouillage / retour dans l'application.
 *******************************************************/

let lecteurQR = null;
let camerasDisponibles = [];
let cameraCourante = "";
let scannerActif = false;
let demarrageEnCours = false;
let repriseTimer = null;
let timerRecherche = null;
let compteurRecherche = 0;

const CLE_CAMERA = "prioriteSelfCameraIdV2";

function creerLecteur_() {
  if (!lecteurQR) {
    lecteurQR = new Html5Qrcode("reader");
  }
  return lecteurQR;
}

async function obtenirPermissionEtCameras_() {
  /*
   * Sur beaucoup de téléphones, enumerateDevices() masque les différents
   * objectifs tant qu'une première autorisation caméra n'a pas été accordée.
   */
  try {
    const permission = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    permission.getTracks().forEach(function(track) {
      track.stop();
    });
  } catch (e) {
    // Html5Qrcode affichera ensuite l'erreur utile si l'accès est refusé.
  }

  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    camerasDisponibles = devices
      .filter(function(device) {
        return device.kind === "videoinput";
      })
      .map(function(device, index) {
        return {
          id: device.deviceId,
          label: device.label || ("Caméra " + (index + 1))
        };
      });
  } catch (e) {
    camerasDisponibles = [];
  }

  return camerasDisponibles;
}

function choisirCameraArriere_() {
  const memorisee = localStorage.getItem(CLE_CAMERA) || "";

  if (
    memorisee &&
    camerasDisponibles.some(function(c) {
      return c.id === memorisee;
    })
  ) {
    return memorisee;
  }

  const motsArriere =
    /back|rear|environment|arrière|arriere|world|0\.5|1x|2x|3x/i;

  const candidates = camerasDisponibles.filter(function(c) {
    return motsArriere.test(c.label || "");
  });

  if (candidates.length) {
    /*
     * Le premier objectif arrière exposé est généralement le principal.
     * Le bouton permet ensuite de parcourir tous les objectifs disponibles.
     */
    return candidates[0].id;
  }

  return camerasDisponibles.length
    ? camerasDisponibles[camerasDisponibles.length - 1].id
    : "";
}

async function appliquerReglagesCamera_() {
  const video = document.querySelector("#reader video");

  if (!video || !video.srcObject) return;

  video.setAttribute("playsinline", "true");
  video.setAttribute("autoplay", "true");

  const tracks = video.srcObject.getVideoTracks();

  if (!tracks.length) return;

  const track = tracks[0];

  try {
    const settings = track.getSettings ? track.getSettings() : {};

    if (settings.deviceId) {
      cameraCourante = settings.deviceId;
      localStorage.setItem(CLE_CAMERA, cameraCourante);
    }
  } catch (e) {}

  /*
   * Ne jamais imposer focusMode à un téléphone qui ne l'annonce pas.
   * Quand "continuous" existe, on l'active explicitement.
   */
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const advanced = [];

    if (
      Array.isArray(caps.focusMode) &&
      caps.focusMode.indexOf("continuous") !== -1
    ) {
      advanced.push({ focusMode: "continuous" });
    }

    if (caps.width && caps.width.max) {
      advanced.push({ width: caps.width.max });
    }

    if (caps.height && caps.height.max) {
      advanced.push({ height: caps.height.max });
    }

    if (advanced.length) {
      for (const contrainte of advanced) {
        try {
          await track.applyConstraints({ advanced: [contrainte] });
        } catch (e) {}
      }
    }
  } catch (e) {}
}

async function demarrerScanner_(cameraId) {
  if (demarrageEnCours || scannerActif) return;

  demarrageEnCours = true;

  try {
    const lecteur = creerLecteur_();

    if (!camerasDisponibles.length) {
      await obtenirPermissionEtCameras_();
    }

    const id =
      cameraId ||
      choisirCameraArriere_();

    /*
     * Si le navigateur fournit des deviceId, on choisit précisément
     * l'objectif. Sinon on demande simplement la caméra arrière.
     */
    const cameraConfig = id
      ? { deviceId: { exact: id } }
      : { facingMode: { ideal: "environment" } };

    await lecteur.start(
      cameraConfig,
      {
        fps: 12,

        /*
         * Pas d'aspectRatio forcé : certains téléphones basculaient sur
         * un mode vidéo médiocre en 1:1.
         */
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const taille = Math.max(
            220,
            Math.floor(minEdge * 0.82)
          );

          return {
            width: Math.min(taille, viewfinderWidth),
            height: Math.min(taille, viewfinderHeight)
          };
        },

        /*
         * On demande une image suffisamment détaillée pour les petits QR,
         * tout en laissant le navigateur choisir la résolution réellement
         * supportée par l'objectif.
         */
        videoConstraints: {
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      },
      qrDetecte,
      function() {}
    );

    scannerActif = true;

    await appliquerReglagesCamera_();

    /*
     * Maintenant que la caméra tourne, les libellés et objectifs sont
     * souvent tous visibles. On rafraîchit donc la liste.
     */
    await obtenirListeCamerasSansCouper_();

    document.getElementById("etat").textContent =
      "Scanner prêt • " + camerasDisponibles.length + " caméra(s)";

  } catch (e) {
    scannerActif = false;

    document.getElementById("etat").textContent =
      "Caméra non disponible";

    afficherErreur(
      "Impossible de démarrer correctement la caméra. Vérifiez l’autorisation caméra puis rechargez la page."
    );
  } finally {
    demarrageEnCours = false;
  }
}

async function obtenirListeCamerasSansCouper_() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();

    camerasDisponibles = devices
      .filter(function(device) {
        return device.kind === "videoinput";
      })
      .map(function(device, index) {
        return {
          id: device.deviceId,
          label: device.label || ("Caméra " + (index + 1))
        };
      });
  } catch (e) {}
}

async function arreterScanner_() {
  if (!lecteurQR || !scannerActif) return;

  try {
    await lecteurQR.stop();
  } catch (e) {}

  scannerActif = false;
}

async function changerCamera_() {
  if (demarrageEnCours) return;

  await obtenirListeCamerasSansCouper_();

  if (camerasDisponibles.length < 2) {
    /*
     * Nouvelle tentative d'énumération avec permission explicite.
     */
    await arreterScanner_();
    await obtenirPermissionEtCameras_();

    if (camerasDisponibles.length < 2) {
      await demarrerScanner_(choisirCameraArriere_());
      afficherErreur(
        "Le navigateur n’expose qu’une seule caméra sur cet appareil."
      );
      return;
    }
  } else {
    await arreterScanner_();
  }

  let index = camerasDisponibles.findIndex(function(c) {
    return c.id === cameraCourante;
  });

  if (index < 0) index = 0;

  const suivante =
    camerasDisponibles[
      (index + 1) % camerasDisponibles.length
    ];

  cameraCourante = suivante.id;
  localStorage.setItem(CLE_CAMERA, cameraCourante);

  await demarrerScanner_(cameraCourante);

  document.getElementById("etat").textContent =
    "Caméra : " + (suivante.label || "sélectionnée");
}

function programmerRepriseScanner_() {
  clearTimeout(repriseTimer);

  repriseTimer = setTimeout(async function() {
    if (document.hidden || bloque || demarrageEnCours) return;

    /*
     * Après un verrouillage, le flux vidéo peut être présent en mémoire
     * mais réellement suspendu. On le recrée proprement.
     */
    await arreterScanner_();

    if (!document.hidden && !bloque) {
      await obtenirListeCamerasSansCouper_();
      await demarrerScanner_(
        localStorage.getItem(CLE_CAMERA) || ""
      );
    }
  }, 450);
}

document
  .getElementById("boutonCamera")
  .addEventListener("click", changerCamera_);

document.addEventListener("visibilitychange", function() {
  if (!document.hidden) {
    programmerRepriseScanner_();
  }
});

window.addEventListener("pageshow", function() {
  programmerRepriseScanner_();
});

window.addEventListener("focus", function() {
  if (!document.hidden && !scannerActif) {
    programmerRepriseScanner_();
  }
});


/*******************************************************
 * RECHERCHE D'UN ÉLÈVE SANS CARTE
 *******************************************************/

function rechercherEleves_(texte) {
  const q = String(texte || "").trim();
  const zone = document.getElementById("resultatsRecherche");

  if (q.length < 2) {
    zone.style.display = "none";
    zone.innerHTML = "";
    return;
  }

  compteurRecherche++;
  const callbackName = "prioriteSelfRecherche_" + compteurRecherche;
  const script = document.createElement("script");

  window[callbackName] = function(resultats) {
    nettoyerJSONP(script, callbackName);
    afficherResultatsRecherche_(Array.isArray(resultats) ? resultats : []);
  };

  script.onerror = function() {
    nettoyerJSONP(script, callbackName);
    zone.style.display = "none";
  };

  script.src =
    API_URL +
    "?api=1" +
    "&recherche=" + encodeURIComponent(q) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  document.body.appendChild(script);
}

function afficherResultatsRecherche_(resultats) {
  const zone = document.getElementById("resultatsRecherche");

  if (!resultats.length) {
    zone.innerHTML =
      '<div class="resultat-eleve">Aucun élève trouvé</div>';
    zone.style.display = "block";
    return;
  }

  zone.innerHTML = resultats.map(function(e, i) {
    return (
      '<div class="resultat-eleve" data-index="' + i + '">' +
      '<strong>' + echapperRecherche_(e.prenom + " " + e.nom) + '</strong>' +
      ' • ' + echapperRecherche_(e.classe || "") +
      '</div>'
    );
  }).join("");

  zone.querySelectorAll(".resultat-eleve[data-index]").forEach(function(el) {
    el.addEventListener("click", function() {
      const e = resultats[Number(el.dataset.index)];
      if (!e) return;

      zone.style.display = "none";
      document.getElementById("rechercheEleve").value = "";
      bloque = true;
      verifierEleve(e.id);
    });
  });

  zone.style.display = "block";
}

function echapperRecherche_(texte) {
  return String(texte || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

document.getElementById("rechercheEleve")
  .addEventListener("input", function() {
    const valeur = this.value;

    clearTimeout(timerRecherche);
    timerRecherche = setTimeout(function() {
      rechercherEleves_(valeur);
    }, 250);
  });

document.addEventListener("click", function(e) {
  const zone = document.getElementById("resultatsRecherche");
  const champ = document.getElementById("rechercheEleve");

  if (e.target !== champ && !zone.contains(e.target)) {
    zone.style.display = "none";
  }
});


/*******************************************************
 * DÉMARRAGE
 *******************************************************/

(async function initialiserScanner_() {
  await obtenirPermissionEtCameras_();
  await demarrerScanner_(choisirCameraArriere_());
})();
