<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Priorité Self</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }


    /* ========================================
       ÉCRAN SCANNER
       ======================================== */

    #scannerPage {

      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      background:
        linear-gradient(
          180deg,
          #181818,
          #050505
        );

    }


    .entete {

      width: 100%;

      padding:
        25px
        20px
        15px;

      text-align: center;

    }


    .logo {

      font-size: 14px;

      font-weight: bold;

      letter-spacing: 4px;

      color: #aaa;

    }


    h1 {

      margin:
        12px
        0
        6px;

      font-size: 32px;

    }


    .instruction {

      margin: 0;

      color: #bbb;

      font-size: 17px;

    }


    /* ========================================
       CAMÉRA
       ======================================== */

    .camera-container {

      width: 92%;

      max-width: 500px;

      margin-top: 20px;

      padding: 8px;

      background: white;

      border-radius: 24px;

      overflow: hidden;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.55);

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 17px;

      color: black;

    }


    #reader video {

      border-radius: 17px;

    }


    .etat {

      margin-top: 25px;

      font-size: 16px;

      color: #aaa;

    }


    #erreur {

      display: none;

      width: 90%;

      max-width: 500px;

      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      background: #721c24;

      color: white;

      font-size: 16px;

      text-align: center;

    }


    /* ========================================
       CHARGEMENT
       ======================================== */

    #chargement {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 9000;

      background:
        rgba(
          0,
          0,
          0,
          0.88
        );

      align-items: center;
      justify-content: center;
      flex-direction: column;

      font-size: 22px;

      font-weight: bold;

    }


    #chargement.visible {

      display: flex;

    }


    .spinner {

      width: 65px;

      height: 65px;

      margin-bottom: 25px;

      border:
        7px solid
        rgba(
          255,
          255,
          255,
          0.25
        );

      border-top-color: white;

      border-radius: 50%;

      animation:
        rotation
        0.8s
        linear
        infinite;

    }


    @keyframes rotation {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* ========================================
       RÉSULTAT
       ======================================== */

    #resultat {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 9999;

      padding: 25px;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      text-align: center;

    }


    #resultat.vert {

      display: flex;

      background:
        linear-gradient(
          180deg,
          #20ad58,
          #087637
        );

    }


    #resultat.rouge {

      display: flex;

      background:
        linear-gradient(
          180deg,
          #e34136,
          #a81717
        );

    }


    .resultat-carte {

      width: 100%;

      max-width: 520px;

    }


    #symbole {

      width: 170px;

      height: 170px;

      margin:
        0
        auto
        25px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        5px solid white;

      background:
        rgba(
          255,
          255,
          255,
          0.17
        );

      font-size: 100px;

      font-weight: bold;

    }


    #statut {

      font-size: 38px;

      line-height: 1.05;

      font-weight: 900;

      margin-bottom: 30px;

    }


    #nom {

      font-size: 32px;

      font-weight: bold;

    }


    #classe {

      margin-top: 7px;

      font-size: 21px;

      opacity: 0.9;

    }


    #club {

      margin-top: 30px;

      font-size: 27px;

      font-weight: bold;

    }


    #horaire {

      margin-top: 10px;

      font-size: 23px;

    }


    #controle {

      margin-top: 30px;

      font-size: 16px;

      opacity: 0.8;

    }


    #boutonSuivant {

      width: 100%;

      max-width: 350px;

      margin-top: 35px;

      padding:
        18px
        20px;

      border: 0;

      border-radius: 16px;

      background: white;

      color: #111;

      font-size: 20px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.20);

    }


    #boutonSuivant:active {

      transform:
        scale(0.97);

    }

  </style>

</head>


<body>


  <!-- ========================================
       SCANNER
       ======================================== -->

  <div id="scannerPage">


    <div class="entete">

      <div class="logo">
        PRIORITÉ SELF
      </div>

      <h1>
        📷 Scanner
      </h1>

      <p class="instruction">
        Présentez le QR code de l'élève
      </p>

    </div>


    <div class="camera-container">

      <div id="reader"></div>

    </div>


    <div class="etat" id="etat">

      Scanner prêt

    </div>


    <div id="erreur"></div>


  </div>



  <!-- ========================================
       CHARGEMENT
       ======================================== -->

  <div id="chargement">

    <div class="spinner"></div>

    Vérification...

  </div>



  <!-- ========================================
       RÉSULTAT
       ======================================== -->

  <div id="resultat">


    <div class="resultat-carte">


      <div id="symbole"></div>


      <div id="statut"></div>


      <div id="nom"></div>


      <div id="classe"></div>


      <div id="club"></div>


      <div id="horaire"></div>


      <div id="controle"></div>


      <button
        id="boutonSuivant"
        onclick="scannerSuivant()"
      >

        📷 Scanner le suivant

      </button>


    </div>


  </div>



<script>


/*******************************************************
 * CONFIGURATION
 *******************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyqJNwQPv3fi45h6qHdzgPkrwI4rTmCAjGRm-M6n9oQkb-3p43Uwk02BRdF9P-9I1dC2A/exec";


let bloque =
  false;


let compteurJSONP =
  0;



/*******************************************************
 * QR DÉTECTÉ
 *******************************************************/

function qrDetecte(
  texte
) {


  if (bloque) {

    return;

  }


  bloque =
    true;


  document
    .getElementById(
      "etat"
    )
    .textContent =
      "QR détecté ✓";


  let id =
    "";


  /*****************************************************
   * EXTRACTION DE L'IDENTIFIANT
   *****************************************************/

  try {


    const url =
      new URL(
        texte
      );


    id =
      url.searchParams.get(
        "id"
      ) || "";


  } catch (e) {


    /*
     * Le QR peut également contenir
     * uniquement l'identifiant.
     */

    id =
      String(
        texte || ""
      ).trim();

  }


  id =
    String(
      id || ""
    ).trim();


  if (!id) {


    afficherErreur(
      "QR code non reconnu."
    );


    bloque =
      false;


    return;

  }


  verifierEleve(
    id
  );

}



/*******************************************************
 * APPEL JSONP
 *
 * Cette méthode évite les problèmes CORS
 * entre GitHub Pages et Apps Script.
 *******************************************************/

function verifierEleve(
  id
) {


  afficherChargement(
    true
  );


  compteurJSONP++;


  const callbackName =
    "prioriteSelfCallback_" +
    compteurJSONP;


  let script =
    document.createElement(
      "script"
    );


  let timeout =
    null;


  /*
   * Fonction appelée automatiquement
   * par Apps Script.
   */

  window[callbackName] =
    function(resultat) {


      clearTimeout(
        timeout
      );


      afficherChargement(
        false
      );


      nettoyerJSONP(
        script,
        callbackName
      );


      afficherResultat(
        resultat
      );

    };



  /*****************************************************
   * EN CAS D'ERREUR RÉSEAU
   *****************************************************/

  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      afficherChargement(
        false
      );


      nettoyerJSONP(
        script,
        callbackName
      );


      afficherErreur(
        "Impossible de contacter le serveur."
      );


      bloque =
        false;

    };



  /*****************************************************
   * CONSTRUCTION DE L'URL
   *****************************************************/

  script.src =

    API_URL

    +

    "?api=1"

    +

    "&id="

    +

    encodeURIComponent(
      id
    )

    +

    "&callback="

    +

    encodeURIComponent(
      callbackName
    )

    +

    "&t="

    +

    Date.now();



  /*****************************************************
   * TIMEOUT DE SÉCURITÉ
   *****************************************************/

  timeout =
    setTimeout(
      function() {


        afficherChargement(
          false
        );


        nettoyerJSONP(
          script,
          callbackName
        );


        afficherErreur(
          "Le serveur met trop de temps à répondre."
        );


        bloque =
          false;


      },
      12000
    );



  /*****************************************************
   * ENVOI
   *****************************************************/

  document.body.appendChild(
    script
  );

}



/*******************************************************
 * NETTOYAGE JSONP
 *******************************************************/

function nettoyerJSONP(
  script,
  callbackName
) {


  try {


    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }


  } catch (e) {

  }


  try {


    delete window[
      callbackName
    ];


  } catch (e) {


    window[
      callbackName
    ] =
      undefined;

  }

}



/*******************************************************
 * AFFICHAGE DU RÉSULTAT
 *******************************************************/

function afficherResultat(
  r
) {


  const zone =
    document.getElementById(
      "resultat"
    );


  const symbole =
    document.getElementById(
      "symbole"
    );



  /*****************************************************
   * VERT
   *****************************************************/

  if (
    r.autorise
  ) {


    zone.className =
      "vert";


    symbole.textContent =
      "✓";


  }


  /*****************************************************
   * ROUGE
   *****************************************************/

  else {


    zone.className =
      "rouge";


    symbole.textContent =
      "✕";

  }



  /*****************************************************
   * TITRE
   *****************************************************/

  document
    .getElementById(
      "statut"
    )
    .textContent =

      r.titre || "";



  /*****************************************************
   * NOM
   *****************************************************/

  const nomComplet =

    (
      (r.prenom || "")
      +
      " "
      +
      (r.nom || "")
    )
    .trim();


  document
    .getElementById(
      "nom"
    )
    .textContent =
      nomComplet;



  /*****************************************************
   * CLASSE
   *****************************************************/

  document
    .getElementById(
      "classe"
    )
    .textContent =

      r.classe || "";



  /*****************************************************
   * CLUB OU MOTIF DU REFUS
   *****************************************************/

  document
    .getElementById(
      "club"
    )
    .textContent =

      r.autorise

      ?

      (
        r.club || ""
      )

      :

      (
        r.message || ""
      );



  /*****************************************************
   * HORAIRE DU CLUB
   *****************************************************/

  document
    .getElementById(
      "horaire"
    )
    .textContent =

      r.autorise

      ?

      (
        (r.debut || "")
        +
        " → "
        +
        (r.fin || "")
      )

      :

      "";



  /*****************************************************
   * HEURE DU CONTRÔLE
   *****************************************************/

  document
    .getElementById(
      "controle"
    )
    .textContent =

      "Contrôle : "

      +

      (r.jourControle || "")

      +

      " à "

      +

      (r.heureControle || "");

}



/*******************************************************
 * SCANNER LE SUIVANT
 *******************************************************/

function scannerSuivant() {


  document
    .getElementById(
      "resultat"
    )
    .className =
      "";


  document
    .getElementById(
      "etat"
    )
    .textContent =
      "Scanner prêt";


  bloque =
    false;

}



/*******************************************************
 * CHARGEMENT
 *******************************************************/

function afficherChargement(
  visible
) {


  const chargement =
    document.getElementById(
      "chargement"
    );


  chargement.className =

    visible

    ?

    "visible"

    :

    "";

}



/*******************************************************
 * ERREUR
 *******************************************************/

function afficherErreur(
  message
) {


  const erreur =
    document.getElementById(
      "erreur"
    );


  erreur.style.display =
    "block";


  erreur.textContent =
    message;


  setTimeout(
    function() {


      erreur.style.display =
        "none";


    },
    5000
  );

}



/*******************************************************
 * DÉMARRAGE DU SCANNER
 *******************************************************/

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps:
        10,

      qrbox:
        {
          width:
            250,

          height:
            250
        },

      rememberLastUsedCamera:
        true,

      supportedScanTypes:
        [
          Html5QrcodeScanType
            .SCAN_TYPE_CAMERA
        ]

    },

    false

  );



scanner.render(

  qrDetecte,

  function() {

    /*
     * Les échecs de lecture image par image
     * sont normaux et sont ignorés.
     */

  }

);


</script>


</body>

</html>
